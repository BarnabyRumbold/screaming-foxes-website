<title>Screaming Foxes | Solitude</title>

<style>

@font-face {
    font-family: 'Switzer';
    src: url('Switzer-Regular.woff2') format('woff2');
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #F5F1EA;
    color: #3B3B3B;
    font-family: 'Switzer', sans-serif;
    overflow-x: hidden;
}

/* HEADER */

header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 35px 40px;
}

.site-title {
    font-size: 2rem;
    font-weight: 400;
    letter-spacing: 8px;
    color: #3B3B3B;
}

/* NAVIGATION */

.nav {
    display: flex;
    align-items: center;
    gap: 45px;
}

.nav a {
    text-decoration: none;
    color: #3B3B3B;

    font-size: 0.85rem;
    letter-spacing: 2px;
    text-transform: uppercase;

    transition: opacity 0.3s ease;
}

.nav a:hover {
    opacity: 0.6;
}

.instagram-link svg {
    width: 18px;
    height: 18px;
    display: block;
}

/* IMAGE */

.album-frame {
    width: 90%;
    max-width: 950px;

    margin: 20px auto 0 auto;
}

.album-frame img {
    width: 100%;
    max-height: 72vh;

    object-fit: contain;
    display: block;
}

/* MOBILE */

@media (max-width: 900px) {

    header {
        flex-direction: column;
        gap: 25px;
        padding: 30px 20px;
    }

    .site-title {
        font-size: 1.4rem;
        letter-spacing: 4px;
    }

    .nav {
        gap: 20px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .nav a {
        font-size: 0.75rem;
    }

    .album-frame {
        width: 95%;
        margin-top: 10px;
    }

    .album-frame img {
        max-height: 60vh;
    }
}

</style>
</head>
