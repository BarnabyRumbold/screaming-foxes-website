<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Screaming Foxes | Solitude</title>

<style>

@font-face {
    font-family: 'Switzer';
    src: url('Switzer-Regular.woff2') format('woff2');
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #F5F1EA;
    color: #3B3B3B;
    font-family: 'Switzer', sans-serif;
    overflow-x: hidden;
}

/* HEADER */

header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 30px 30px;
}

.site-title {
    font-size: 2rem;
    font-weight: 400;
    letter-spacing: 8px;
    color: #3B3B3B;
}

/* NAVIGATION */

.nav {
    display: flex;
    align-items: center;
    gap: 30px;
}

.nav a {
    text-decoration: none;
    color: #3B3B3B;

    font-size: 0.8rem;
    letter-spacing: 2px;
    text-transform: uppercase;

    transition: opacity 0.3s ease;
}

.nav a:hover {
    opacity: 0.6;
}

/* ICONS */

.icon-link {
    font-size: 1rem;
    line-height: 1;
}

/* IMAGE */

.album-frame {
    width: 88%;
    max-width: 950px;

    margin: 20px auto 0 auto;
}

.album-frame img {
    width: 100%;
    max-height: 70vh;

    object-fit: contain;
    display: block;
}

/* MOBILE */

@media (max-width: 900px) {

    header {
        flex-direction: column;
        gap: 25px;
    }

    .site-title {
        font-size: 1.3rem;
        letter-spacing: 4px;
    }

    .nav {
        gap: 15px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .nav a {
        font-size: 0.7rem;
    }

    .album-frame img {
        max-height: 55vh;
    }
}

</style>

</head>

<body>

<header>

    <div class="site-title">
        SCREAMING FOXES
    </div>

    <nav class="nav">

           ⬡

        #

    </nav>

</header>

</body>
</html>
