<style>
@font-face {
    font-family: 'Switzer';
    src: url('Switzer-Regular.woff2') format('woff2');
}
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    background: #F5F1EA;
    color: #3B3B3B;
    font-family: 'Switzer', sans-serif;
    overflow-x: hidden;
    min-height: 100vh;
}

/* HEADER */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 30px 40px;
    flex-wrap: wrap;
    gap: 20px;
}
.site-title {
    font-size: 2rem;
    font-weight: 400;
    letter-spacing: 8px;
    color: #3B3B3B;
    white-space: nowrap;
    text-decoration: none;
}
.nav {
    display: flex;
    align-items: center;
    gap: 30px;
    flex-wrap: wrap;
    justify-content: flex-end;
}
.nav-links {
    display: flex;
    align-items: center;
    gap: 28px;
}
.nav-links a {
    text-decoration: none;
    color: #3B3B3B;
    font-size: 0.8rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: opacity 0.3s ease;
    white-space: nowrap;
}
.nav-links a:hover {
    opacity: 0.6;
}
.social-links {
    display: flex;
    align-items: center;
    gap: 18px;
}
.icon-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    color: #3B3B3B;
    transition: opacity 0.3s ease;
}
.icon-link:hover {
    opacity: 0.6;
}
.icon-link svg {
    width: 100%;
    height: 100%;
    fill: currentColor;
    display: block;
}
.nav-divider {
    width: 1px;
    height: 16px;
    background: #3B3B3B;
    opacity: 0.25;
}

/* CONTACT FORM */
.contact-wrap {
    width: 88%;
    max-width: 560px;
    margin: 40px auto 100px auto;
}
.contact-wrap h1 {
    font-size: 1.6rem;
    font-weight: 400;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 12px;
}
.contact-wrap p.intro {
    font-size: 0.9rem;
    line-height: 1.6;
    opacity: 0.75;
    margin-bottom: 40px;
}
form {
    display: flex;
    flex-direction: column;
    gap: 24px;
}
.field {
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.field label {
    font-size: 0.7rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.7;
}
.field input,
.field textarea {
    background: transparent;
    border: none;
    border-bottom: 1px solid #3B3B3B;
    padding: 8px 2px;
    font-family: 'Switzer', sans-serif;
    font-size: 0.95rem;
    color: #3B3B3B;
    outline: none;
    resize: vertical;
}
.field textarea {
    min-height: 120px;
}
button[type="submit"] {
    margin-top: 10px;
    align-self: flex-start;
    background: #3B3B3B;
    color: #F5F1EA;
    border: none;
    padding: 14px 34px;
    font-family: 'Switzer', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity 0.3s ease;
}
button[type="submit"]:hover {
    opacity: 0.75;
}

/* MOBILE */
@media (max-width: 900px) {
    header {
        flex-direction: column;
        gap: 22px;
        padding: 30px 20px;
    }
    .site-title {
        font-size: 1.3rem;
        letter-spacing: 4px;
    }
    .nav {
        gap: 18px;
        flex-wrap: wrap;
        justify-content: center;
    }
    .nav-links {
        gap: 16px;
        flex-wrap: wrap;
        justify-content: center;
    }
    .nav-links a {
        font-size: 0.7rem;
    }
    .nav-divider {
        display: none;
    }
    .contact-wrap {
        margin-top: 20px;
    }
}
</style>
</head>
